<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#C5962B"/>
      <stop offset="100%" stop-color="#926D19"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#245239"/>
      <stop offset="100%" stop-color="#163826"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <path d="M 250 30 C 370 30, 440 70, 440 170 C 440 330, 340 440, 250 490 C 160 440, 60 330, 60 170 C 60 70, 130 30, 250 30 Z" fill="url(#greenGrad)" stroke="url(#goldGrad)" stroke-width="8" filter="url(#shadow)"/>
  
  <!-- Inner Border Line -->
  <path d="M 250 50 C 355 50, 415 85, 415 175 C 415 315, 325 415, 250 460 C 175 415, 85 315, 85 175 C 85 85, 145 50, 250 50 Z" fill="none" stroke="#C5962B" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Half Gear -->
  <path d="M 250 150 A 100 100 0 0 1 345 270 L 315 260 A 70 70 0 0 0 250 180 Z" fill="url(#goldGrad)"/>
  <rect x="340" y="225" width="22" height="16" rx="3" fill="url(#goldGrad)" transform="rotate(15 351 233)"/>
  <rect x="330" y="275" width="22" height="16" rx="3" fill="url(#goldGrad)" transform="rotate(45 341 283)"/>
  <rect x="295" y="320" width="22" height="16" rx="3" fill="url(#goldGrad)" transform="rotate(75 306 328)"/>

  <!-- Catana / Machete -->
  <g transform="translate(0, 0)">
    <path d="M 160 340 L 330 170 C 345 155, 365 155, 370 165 C 375 175, 365 195, 345 210 L 190 360 Z" fill="#FFFFFF" stroke="#926D19" stroke-width="2"/>
    <rect x="145" y="330" width="40" height="14" rx="4" fill="url(#goldGrad)" transform="rotate(-45 165 337)"/>
    <circle cx="140" cy="362" r="6" fill="#163826"/>
  </g>

  <!-- Big Golden Star -->
  <polygon points="250,120 264,158 304,158 272,182 284,220 250,196 216,220 228,182 196,158 236,158" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Ribbons / Banner -->
  <path d="M 120 395 L 380 395 L 360 435 L 140 435 Z" fill="#163826" stroke="url(#goldGrad)" stroke-width="3"/>
  <text x="250" y="422" font-family="'Geist', 'Inter', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">EXÉRCITO ANGOLANO</text>
  <text x="250" y="380" font-family="'Geist', 'Inter', sans-serif" font-size="12" font-weight="800" fill="#FCD34D" text-anchor="middle" letter-spacing="6">FORÇAS ARMADAS</text>
</svg>
